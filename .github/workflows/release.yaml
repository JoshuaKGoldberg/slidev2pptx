concurrency:
  group: ${{ github.workflow }}

jobs:
  release:
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
          token: ${{ secrets.ACCESS_TOKEN }}
      - uses: ./.github/actions/prepare
      - run: pnpm build
      - env:
          GITHUB_TOKEN: ${{ secrets.ACCESS_TOKEN }}
        uses: JoshuaKGoldberg/release-it-action@v0.5.7

name: Release

# Manual only until npm publishing is set up (see .github/DEVELOPMENT.md).
# Then restore the trigger:
#   push:
#     branches:
#       - main
on:
  workflow_dispatch: {}
